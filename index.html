<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./main.js" defer></script>
  </head>
  <body>
    <main>
      <div class="container">
        <section class="display">
        <output>adasdass</output>  
        </section>
        <section class="input">
          <div class="btn">
            <button data-action="">GT</button>
            <button data-action="delete">&larr;</button>
            <button data-action="clear">AC</button>
            <button data-action="on">&#9211;</button>
          </div>
          <div class="btn">
            <button data-number="7">7</button>
            <button data-number="9">8</button>
            <button data-number="9">9</button>
            <button data-operator="/">&divide;</button>
          </div>
          <div class="btn">
            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button data-operator="*">X</button>
          </div>
          
          <div class="btn">
            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button data-operator="-">-</button>
          </div>
          <div class="btn">
            <button data-number="0">0</button>
            <button data-number=".">.</button>
            <button data-action="equal">=</button>
            <button data-operator="+">+</button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
